# Off-site copy of the encrypted backups through rclone (S3, Backblaze B2, SFTP, Google Drive…).
# Needs docker-compose.backup.yml. Add both to COMPOSE_FILE in .env, e.g.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml:docker-compose.backup.yml:docker-compose.offsite.yml
# Then create the remote once:  docker compose run --rm --entrypoint rclone offsite config
# and set BACKUP_REMOTE=<remote>:<bucket or folder> in .env. Guide: docs/guide/sauvegardes.md
services:
  offsite:
    image: rclone/rclone:1.71
    restart: unless-stopped
    entrypoint: ["/offsite.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:?BACKUP_REMOTE manquant dans .env (ex. b2:mon-bucket/ticketbot)}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      TZ: ${TZ:-UTC}
    volumes:
      - ./docker/offsite.sh:/offsite.sh:ro
      - ./backups:/backups
      - ./rclone:/config/rclone
    deploy:
      resources:
        limits:
          memory: 256M
