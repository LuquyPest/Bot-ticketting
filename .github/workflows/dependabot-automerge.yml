# Merges Dependabot's grouped minor and patch updates (« *-mineures » groups in dependabot.yml)
# once the whole CI is green on them. Major versions and the other groups stay for a human.
# Runs on the completed CI (workflow_run): no code from the pull request is checked out or run here.
name: Fusion automatique Dependabot

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Fusion si la CI est verte
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && contains(github.event.workflow_run.head_branch, '-mineures-')
    runs-on: ubuntu-latest
    steps:
      - name: Fusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,author,headRefOid \
            --jq ".[] | select(.author.login == \"app/dependabot\" and .headRefOid == \"$SHA\") | .number")
          [ -n "$pr" ] || { echo "Pas de PR ouverte pour ce commit"; exit 0; }
          gh pr merge -R "$REPO" "$pr" --squash --delete-branch --match-head-commit "$SHA"
