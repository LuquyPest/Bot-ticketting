name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the CI only reads the repository
permissions:
  contents: read

# A new push on a pull request cancels the run still going on the previous one
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ticketbot_global
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Annuaire OpenLDAP de test (autorité et certificat propres)
        run: bash tests/integration/ldap-server.sh ldap 389 636 "$RUNNER_TEMP/ldap-certs"
      - name: Suite d'intégration
        run: node tests/integration/harness.js
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          LDAP_TEST_URL: ldaps://localhost:636
          LDAP_TEST_STARTTLS_URL: ldap://localhost:389
          LDAP_TEST_CA: ${{ runner.temp }}/ldap-certs/ca.crt
          REDIS_PORT: 6379
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (variables et composants non définis, clés en double, code inatteignable)
        run: npm run lint

  dashboard:
    # One machine per pass of the smoke test, in parallel (≈ 3 min instead of 14)
    name: Test de fumée du dashboard (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [dark, light, mobile, en, pro, pro-light]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Navigateur headless pour le test de fumée
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Test de fumée (${{ matrix.run }})
        run: npm run test:smoke
        env:
          SMOKE_RUNS: ${{ matrix.run }}
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots-${{ matrix.run }}
          path: dashboard/tests/screenshots/
      - name: Audit des dépendances embarquées
        if: matrix.run == 'dark'
        run: npm audit --omit=dev --audit-level=high

  docs:
    name: Build du site de documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npx vitepress build

  image:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t ticketbot:ci .
      - name: L'image démarre Node et charge ses dépendances
        run: docker run --rm --entrypoint node ticketbot:ci -e "require('discord.js'); require('ioredis'); require('./utils/sessionStore'); require('./utils/metrics'); require('./utils/config'); console.log('ok')"
