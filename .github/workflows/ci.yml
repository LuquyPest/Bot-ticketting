name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the CI only reads the repository
permissions:
  contents: read

jobs:
  integration:
    name: Tests d'intégration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ticketbot_global
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Suite d'intégration
        run: node tests/integration/harness.js
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  dashboard:
    name: Build et test de fumée du dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Navigateur headless pour le test de fumée
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Test de fumée (pages principales, thèmes sombre et clair)
        run: npm run test:smoke
      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: dashboard/tests/screenshots/
      - name: Audit des dépendances embarquées
        run: npm audit --omit=dev --audit-level=high
