# Base, generic stack: MariaDB + Redis + bot/dashboard, reachable on http://127.0.0.1:3000.
# All settings come from .env (see .env.example or scripts/setup.sh).
# HTTPS: add one override file through COMPOSE_FILE in .env —
#   docker-compose.caddy.yml    Caddy included, certificates from Let's Encrypt (recommended)
#   docker-compose.traefik.yml  an existing Traefik on the external « proxy » network
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password from .env (REDIS_PASSWORD), read from the environment: never on the command line
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: sh -c 'exec redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly no --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env}
      MARIADB_DATABASE: ticketbot_global
      MARIADB_USER: botuser
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    # Published image (docker compose pull); `docker compose up -d --build` rebuilds it from the sources
    image: ghcr.io/luquypest/bot-ticketting:${TICKETBOT_VERSION:-latest}
    build: .
    restart: unless-stopped
    # Only what the bot needs from .env — DB_ROOT_PASSWORD must stay out of this container
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OWNER_IDS: ${OWNER_IDS:-}
      ALLOWED_GUILDS: ${ALLOWED_GUILDS:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-}
      BACKUP_KEY: ${BACKUP_KEY:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      TRUSTED_PROXY_HOST: ${TRUSTED_PROXY_HOST:-}
    # Optional config.json instead of (or on top of) the variables above:
    #   volumes: ["./config.json:/app/config.json:ro"]  and  user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  db_data:
  redis_data:
