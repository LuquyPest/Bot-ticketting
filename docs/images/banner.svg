<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a14"/>
      <stop offset="1" stop-color="#14112b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7c6ef3" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c6ef3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="staff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6ef3"/>
      <stop offset="1" stop-color="#5b4bf0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="380" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="380" rx="24" fill="url(#glowB)"/>

  <!-- App icon -->
  <g transform="translate(72 70)" filter="url(#shadow)">
    <rect width="88" height="88" rx="24" fill="url(#icon)"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="22" y="32" width="44" height="34" rx="9"/>
      <path d="M44 32v-9M38 23h12"/>
      <path d="M16 46v8M72 46v8"/>
    </g>
    <circle cx="35.5" cy="48" r="4" fill="#fff"/>
    <circle cx="52.5" cy="48" r="4" fill="#fff"/>
  </g>

  <!-- Title -->
  <text x="72" y="222" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="-1">Sunset Ticket</text>
  <text x="74" y="262" font-size="22" fill="#a9a6c9">Le support Discord par messages privés,</text>
  <text x="74" y="292" font-size="22" fill="#a9a6c9">piloté depuis un dashboard web complet.</text>

  <!-- Chips -->
  <g font-size="14" font-weight="600">
    <g transform="translate(72 318)">
      <rect width="142" height="32" rx="16" fill="#7c6ef3" fill-opacity="0.16" stroke="#7c6ef3" stroke-opacity="0.45"/>
      <text x="71" y="21" text-anchor="middle" fill="#c4b5fd">Multi-serveurs</text>
    </g>
    <g transform="translate(224 318)">
      <rect width="118" height="32" rx="16" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.45"/>
      <text x="59" y="21" text-anchor="middle" fill="#6ee7b7">Temps réel</text>
    </g>
    <g transform="translate(352 318)">
      <rect width="128" height="32" rx="16" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45"/>
      <text x="64" y="21" text-anchor="middle" fill="#fcd34d">2FA &amp; chiffré</text>
    </g>
    <g transform="translate(490 318)">
      <rect width="96" height="32" rx="16" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-opacity="0.45"/>
      <text x="48" y="21" text-anchor="middle" fill="#f9a8d4">FR · EN</text>
    </g>
  </g>

  <!-- Conversation mock -->
  <g transform="translate(720 46)">
    <g filter="url(#shadow)">
      <rect width="488" height="288" rx="20" fill="#16142a" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>
    <g transform="translate(22 22)">
      <circle cx="10" cy="10" r="6" fill="#ef4444" fill-opacity="0.8"/>
      <circle cx="30" cy="10" r="6" fill="#f59e0b" fill-opacity="0.8"/>
      <circle cx="50" cy="10" r="6" fill="#10b981" fill-opacity="0.8"/>
      <text x="76" y="15" font-size="14" font-weight="700" fill="#e9e7ff">Ticket #140</text>
      <rect x="186" y="0" width="66" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="219" y="14.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#34d399">ouvert</text>
      <rect x="260" y="0" width="70" height="20" rx="10" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.5"/>
      <text x="295" y="14.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#f87171">urgent</text>
    </g>
    <line x1="0" y1="62" x2="488" y2="62" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- member -->
    <circle cx="40" cy="104" r="15" fill="#8b5cf6"/>
    <text x="40" y="109.5" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">L</text>
    <rect x="66" y="82" width="270" height="46" rx="14" fill="#221f3a"/>
    <text x="84" y="104" font-size="13.5" fill="#d9d6f5">Mon remboursement n'est</text>
    <text x="84" y="120" font-size="13.5" fill="#d9d6f5">toujours pas arrivé…</text>

    <!-- staff -->
    <rect x="150" y="146" width="282" height="46" rx="14" fill="url(#staff)"/>
    <text x="168" y="168" font-size="13.5" fill="#ffffff">C'est envoyé : il arrive sous</text>
    <text x="168" y="184" font-size="13.5" fill="#ffffff">3 à 5 jours ouvrés.</text>
    <circle cx="452" cy="170" r="15" fill="#4f46e5"/>
    <text x="452" y="175.5" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">A</text>

    <!-- internal note -->
    <rect x="96" y="210" width="296" height="34" rx="10" fill="none" stroke="#f59e0b" stroke-opacity="0.5" stroke-dasharray="5 4"/>
    <g transform="translate(110 219)" fill="none" stroke="#fcd34d" stroke-width="1.6" stroke-linecap="round"><rect x="0" y="5" width="10" height="8" rx="2"/><path d="M2.5 5V3.5a2.5 2.5 0 0 1 5 0V5"/></g>
    <text x="128" y="231.5" font-size="12.5" fill="#fcd34d">Note interne : vérifié sur Stripe</text>

    <!-- footer -->
    <text x="22" y="270" font-size="12" fill="#8b88ad">Inès regarde aussi ce ticket · réponse en 18 min</text>
  </g>
</svg>
